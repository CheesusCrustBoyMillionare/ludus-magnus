<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="a870ebf3">
<title>Ludus Magnus</title>
<link rel="stylesheet" href="css/style.css?v=955debb6">
</head>
<body>
<div id="app">
  <div id="main">
    <canvas id="yard" width="1180" height="380" data-act="yard" data-tip="Your ludus. Buildings grow as you improve them, and the yard shows how the school stands: its record chalked up by the gate, festival crowns under the lintel, gold over the gate while a man of yours is champion. Click a fighter to open his dossier, or a building to improve it or go to its screen."></canvas>
    <canvas id="village" width="1180" height="380" data-act="village"></canvas>
    <main id="view"></main>
  </div>
  <aside id="side">
    <header id="topbar"></header>
    <div id="sidefoot"></div>
  </aside>
</div>

<div id="wilds" hidden>
  <canvas id="wildCanvas" width="960" height="720" data-act="wildclick"></canvas>
  <aside id="camp"></aside>
</div>

<div id="arena" hidden>
  <div id="arenaHead"></div>
  <canvas id="arenaCanvas" width="1280" height="720"></canvas>
  <div id="arenaPick" hidden></div>
  <div id="arenaLog" hidden></div>
  <div id="arenaTip" hidden></div>
  <div id="arenaBar">
    <div id="arenaOrders" class="grp"><span class="gl">Orders</span>
      <button data-act="order" data-v="yield" id="ordYield" data-key="C" data-tip="Throw in the cloth: your worst-hurt man yields at once. A man who yields is spared far more often than one struck down. Once per bout, and it cannot be taken back, so it asks you twice.">Throw in the cloth</button>
    </div>
    <div id="arenaCtl">
      <div class="grp"><span class="gl">Speed</span>
        <button data-act="speed" data-v="0.5" data-tip="Half speed, to watch a hard exchange closely.">&frac12;x</button>
        <button data-act="speed" data-v="1">1x</button>
        <button data-act="speed" data-v="2">2x</button>
        <button data-act="speed" data-v="4">4x</button>
        <button data-act="pause" id="pauseBtn" data-key="Space" data-tip="Stops the fight where it stands so you can look. Rest the mouse on any fighter to see what he is and what he carries.">Pause</button>
        <button data-act="fstep" id="stepBtn" data-key="." data-tip="Stops the fight if it is running, then moves it on a tenth of a second at each press.">Step</button>
      </div>
      <div class="grp"><span class="gl">Fight</span>
        <button data-act="abauto" id="autoCast" data-tip="Ask me: the fight stops each time one of your men is charged, and you choose his ability (keys 1 to 4). Auto: they choose for themselves and the fight never stops.">Abilities: ask me</button>
        <button data-act="cutins" id="cutBtn" data-tip="On: when an ability is used the fight holds for a moment and a band crosses the screen with the fighter and the ability's name. A man's death is shown the same way. Off: abilities land, and men die, without ceremony. In fights of more than six, only your own men are announced.">Cut-ins: on</button>
        <button data-act="fcam" id="camBtn" data-tip="Follows: the view keeps to the men still fighting, coming closer when they are bunched and drawing back when they spread. Fixed: the whole arena, always. Either way it closes in on the blow that ends the fight.">Camera: follows</button>
        <button data-act="flog" id="logBtn" data-key="L" data-tip="Everything that has happened in this fight, line by line, with the time of each.">Log</button>
      </div>
      <div class="grp"><span class="gl">&nbsp;</span>
        <button data-act="mute" id="muteBtn">Sound on</button>
        <button data-act="menu" data-key="Esc" data-tip="Stops the fight and opens the menu: settings, the figures of your house, help, and the way out.">Menu</button>
        <button id="keysBtn" data-act="help" data-v="keys" data-key="H" data-tip="Stops the fight and opens the book at the page of keys. The page before it is about fights.">Keys</button>
        <button data-act="skip" id="skipBtn" data-tip="Plays the rest of the fight out unseen and goes straight to the result. It asks you twice.">Skip to result</button>
      </div>
    </div>
  </div>
</div>

<div id="tutor" hidden></div>
<div id="tip" hidden></div>

<div id="modal" hidden><div id="modalBox"></div></div>

<script src="js/data.js?v=6ef74a0c"></script>
<script src="js/sim.js?v=56f3e08d"></script>
<script src="js/jobs.js?v=35a2707f"></script>
<script src="js/wilds.js?v=7c153300"></script>
<script src="js/combat.js?v=0791449f"></script>
<script src="js/abilities.js?v=e2df6fe0"></script>
<script src="js/show.js?v=9ee88ad3"></script>
<script src="js/sfx.js?v=f45cc5ad"></script>
<script src="js/yard.js?v=4f853c66"></script>
<script src="js/places.js?v=9d610270"></script>
<script src="js/village.js?v=efada26b"></script>
<script src="js/province.js?v=35049866"></script>
<script src="js/art.js?v=b8c4adbe"></script>
<script src="js/main.js?v=276bc38e"></script>
</body>
</html>
