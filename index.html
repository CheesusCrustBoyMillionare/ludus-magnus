<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="c65d0753">
<title>Ludus Magnus</title>
<link rel="stylesheet" href="css/style.css?v=4a836b97">
</head>
<body>
<div id="app">
  <div id="main">
    <canvas id="yard" width="1180" height="380" data-act="yard" data-tip="Your ludus. Buildings grow as you improve them. Click a fighter to open his dossier, or a building to go to its screen."></canvas>
    <canvas id="village" width="1180" height="380" data-act="village"></canvas>
    <main id="view"></main>
  </div>
  <aside id="side">
    <header id="topbar"></header>
    <div id="sidefoot"></div>
  </aside>
</div>

<div id="wilds" hidden>
  <canvas id="wildCanvas" width="960" height="720" data-act="wildclick"></canvas>
  <aside id="camp"></aside>
</div>

<div id="arena" hidden>
  <div id="arenaHead"></div>
  <canvas id="arenaCanvas" width="1280" height="720"></canvas>
  <div id="arenaPick" hidden></div>
  <div id="arenaOrders">
    <button data-act="order" data-v="yield" id="ordYield" data-tip="Throw in the cloth: your worst-hurt man yields at once. A man who yields is spared far more often than one struck down. Once per bout. Key: C">Throw in the cloth</button>
    <button data-act="abauto" id="autoCast" data-tip="Ask me: the fight stops each time one of your men is charged, and you choose his ability (keys 1 to 4). Auto: they choose for themselves and the fight never stops.">Abilities: ask me</button>
  </div>
  <div id="arenaCtl">
    <button data-act="speed" data-v="1">1x</button>
    <button data-act="speed" data-v="2">2x</button>
    <button data-act="speed" data-v="4">4x</button>
    <button data-act="pause" id="pauseBtn" data-tip="Stops the fight where it stands so you can look. Rest the mouse on any fighter to see what he is and what he carries. Key: Space">Pause</button>
    <button data-act="skip">Skip to result</button>
    <button data-act="mute" id="muteBtn">Sound on</button>
  </div>
</div>

<div id="tutor" hidden></div>
<div id="tip" hidden></div>

<div id="modal" hidden><div id="modalBox"></div></div>

<script src="js/data.js?v=7b395a7b"></script>
<script src="js/sim.js?v=248131c3"></script>
<script src="js/jobs.js?v=a50dda73"></script>
<script src="js/wilds.js?v=3468dac5"></script>
<script src="js/combat.js?v=0510ca25"></script>
<script src="js/abilities.js?v=c0b114ca"></script>
<script src="js/show.js?v=b5132bcf"></script>
<script src="js/sfx.js?v=090f1688"></script>
<script src="js/yard.js?v=7eead954"></script>
<script src="js/village.js?v=0d8bddc7"></script>
<script src="js/province.js?v=8e779902"></script>
<script src="js/art.js?v=0d9d27b8"></script>
<script src="js/main.js?v=d07862df"></script>
</body>
</html>
