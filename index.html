<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="08a3a8f9">
<title>Ludus Magnus</title>
<link rel="stylesheet" href="css/style.css?v=c8262735">
</head>
<body>
<div id="app">
  <div id="head">
    <canvas id="yard" width="1180" height="380" data-act="yard" data-tip="Your ludus. Buildings grow as you improve them. Click a fighter to open his dossier, or a building to go to its screen."></canvas>
    <div id="headmain">
      <header id="topbar"></header>
      <nav id="tabs"></nav>
    </div>
  </div>
  <main id="view"></main>
</div>

<div id="arena" hidden>
  <div id="arenaHead"></div>
  <canvas id="arenaCanvas" width="1280" height="720"></canvas>
  <div id="arenaOrders">
    <button data-act="order" data-v="press" id="ordPress" data-tip="Your men attack faster and hit harder for eight seconds, and will not stop for breath, but they block and dodge less. Key: 1">Press!</button>
    <button data-act="order" data-v="hold" id="ordHold" data-tip="Your men block and dodge more and get their wind back for eight seconds, but strike slower and softer. Key: 2">Hold!</button>
    <button data-act="order" data-v="yield" id="ordYield" data-tip="Throw in the cloth: your worst-hurt man yields at once. A man who yields is spared far more often than one struck down. Once per bout. Key: 3">Throw in the cloth</button>
  </div>
  <div id="arenaCtl">
    <button data-act="speed" data-v="1">1x</button>
    <button data-act="speed" data-v="2">2x</button>
    <button data-act="speed" data-v="4">4x</button>
    <button data-act="skip">Skip to result</button>
    <button data-act="mute" id="muteBtn">Sound on</button>
  </div>
</div>

<div id="tutor" hidden></div>
<div id="tip" hidden></div>

<div id="modal" hidden><div id="modalBox"></div></div>

<script src="js/data.js?v=9ee0ea9f"></script>
<script src="js/sim.js?v=382ddff9"></script>
<script src="js/jobs.js?v=76d1efc2"></script>
<script src="js/combat.js?v=50be2a56"></script>
<script src="js/show.js?v=1afb1116"></script>
<script src="js/sfx.js?v=afa7181b"></script>
<script src="js/yard.js?v=7eead954"></script>
<script src="js/art.js?v=0d9d27b8"></script>
<script src="js/main.js?v=457515a2"></script>
</body>
</html>
