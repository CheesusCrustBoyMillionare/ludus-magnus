<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="f85e909f">
<title>Ludus Magnus</title>
<!-- The mark on the tab: the helmet of the desktop app's icon (drawn in desktop/build.ps1), two dots to a dot. It is written into the page itself, so there is no file to ask for. -->
<link rel="icon" type="image/png" sizes="32x32" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAbUlEQVR42mNQk5GgKWIYFBYcstbDioaCBbiMJt6aUQvIt+DmEkeS0GCyAKLh64UKkhAuawbOAvLQqAXUtEBckB8NIRuES3bUAmpagIkwraFyKhq1AI8FEHHkKMWvcqAtwNRMiZpRC8i3YMi0rgE2KVVuH4tZAQAAAABJRU5ErkJggg==">
<link rel="stylesheet" href="css/style.css?v=b24bcfc8">
</head>
<body>
<div id="app">
  <div id="main">
    <nav id="places" aria-label="Places in town"></nav>
    <canvas id="yard" width="1180" height="380" data-act="yard" data-tip="Your ludus. Buildings grow as you improve them, and the yard shows how the school stands: its record chalked up by the gate, festival crowns under the lintel, gold over the gate while a man of yours is champion. Click a fighter to open his dossier, or a building to improve it or go to its screen."></canvas>
    <canvas id="village" width="1180" height="380" data-act="village"></canvas>
    <main id="view"></main>
  </div>
  <aside id="side">
    <header id="topbar"></header>
    <div id="sidefoot"></div>
  </aside>
</div>

<div id="wilds" role="region" aria-label="The province" hidden>
  <div id="whereabouts"><button data-act="lookabout">Describe where we are</button></div>
  <canvas id="wildCanvas" width="960" height="720" data-act="wildclick"></canvas>
  <aside id="camp"></aside>
</div>

<div id="arena" role="region" aria-label="The arena" hidden>
  <div id="arenaHead"></div>
  <canvas id="arenaCanvas" width="1280" height="720"></canvas>
  <div id="arenaPick" hidden></div>
  <div id="arenaLog" role="region" aria-label="The fight so far" hidden></div>
  <div id="arenaTip" hidden></div>
  <div id="arenaBar">
    <div id="arenaOrders" class="grp"><span class="gl">Orders</span>
      <button data-act="order" data-v="yield" id="ordYield" data-key="C" data-tip="Throw in the cloth: your worst-hurt man yields at once. A man who yields is spared far more often than one struck down. You can do it once per bout. It cannot be undone, so you must press twice to confirm.">Throw in the cloth</button>
    </div>
    <div id="arenaCtl">
      <div class="grp"><span class="gl">Speed</span>
        <button data-act="speed" data-v="0.5" data-tip="Half speed, to watch a hard exchange closely.">&frac12;x</button>
        <button data-act="speed" data-v="1">1x</button>
        <button data-act="speed" data-v="2">2x</button>
        <button data-act="speed" data-v="4">4x</button>
        <button data-act="pause" id="pauseBtn" data-key="Space" data-tip="Pauses the fight so you can look. Hover over any fighter to see who he is and what he carries.">Pause</button>
        <button data-act="fstep" id="stepBtn" data-key="." data-tip="Pauses the fight if it is running, then advances it a tenth of a second with each press.">Step</button>
      </div>
      <div class="grp"><span class="gl">Fight</span>
        <button data-act="abauto" id="autoCast" data-tip="Ask me: the fight pauses each time one of your men has a full charge, and you choose his ability (keys 1 to 4). Auto: your men choose for themselves and the fight never pauses.">Abilities: ask me</button>
        <button data-act="cutins" id="cutBtn" data-tip="On: when an ability is used the fight pauses for a moment and a banner shows the fighter and the ability's name. A man's death is shown the same way. Off: no banners. In fights of more than six, only your own men get banners.">Cut-ins: on</button>
        <button data-act="fcam" id="camBtn" data-tip="Follows: the view tracks the men still fighting, zooming in when they are close together and out when they spread. Fixed: always shows the whole arena. Either way it zooms in on the final blow.">Camera: follows</button>
        <button data-act="flog" id="logBtn" data-key="L" data-tip="Everything that has happened in this fight, line by line, with the time of each.">Log</button>
      </div>
      <div class="grp"><span class="gl none"></span>
        <button data-act="mute" id="muteBtn">Sound on</button>
        <button data-act="menu" data-key="Esc" data-tip="Pauses the fight and opens the menu: settings, statistics of your house, help, and quitting.">Menu</button>
        <button id="keysBtn" data-act="help" data-v="keys" data-key="H" data-tip="Pauses the fight and opens the help at its Keys page. The page before it is about fights.">Keys</button>
        <button data-act="skip" id="skipBtn" data-tip="Works out the rest of the fight without showing it, and goes straight to the result. Press twice to confirm.">Skip to result</button>
      </div>
    </div>
  </div>
</div>

<div id="tutor" hidden></div>
<div id="tip" role="tooltip" hidden></div>

<div id="modal" hidden><div id="modalBox"></div></div>

<script src="js/data.js?v=c9dc9a06"></script>
<script src="js/sim.js?v=5b5fed45"></script>
<script src="js/jobs.js?v=5e652a33"></script>
<script src="js/wilds.js?v=2d1a355c"></script>
<script src="js/combat.js?v=387fa170"></script>
<script src="js/abilities.js?v=ff72bae4"></script>
<script src="js/show.js?v=a4d4f4e2"></script>
<script src="js/sfx.js?v=431d37ad"></script>
<script src="js/yard.js?v=fcd28ddc"></script>
<script src="js/places.js?v=b205bc4c"></script>
<script src="js/village.js?v=706b43ce"></script>
<script src="js/province.js?v=94d4eb9b"></script>
<script src="js/art.js?v=45711003"></script>
<script src="js/main.js?v=3381b45c"></script>
<script src="js/a11y.js?v=932fb7b8"></script>
</body>
</html>
